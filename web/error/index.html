<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltamod error</title>
    <link rel="stylesheet" href="../../commons/base.css">
</head>
<body>
    <div style="color: white;">
        <img src="./aqua.gif" alt="" width="128">
        <br>
        <p>Deltamod encountered an error and had to close.</p>
        <br>
        <div class="error">

        </div>
        <br>
        <button onclick="window.close()">Close</button>
        <br>
        <p class="credit"></p>
    </div>
    <div class="border">

    </div>
    <div class="flowers">

    </div>
</body>
<style>
    .flowers {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        aspect-ratio: 167 / 492;
        background-image: url('./flowers.png');
        background-repeat: no-repeat;
        background-size: contain;
        pointer-events: none;
        opacity: 0.5;
    }
    * {
        image-rendering: pixelated;
    }
    :root {
        --theme-color: #2a2a2a;
    }
    .credit {
        font-size: 0.7em;
        font-family: monospace;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.405);
        opacity: 0.5;
    }
    .border {
       z-index: 100000;
        border: 6px solid #2a2a2a8d;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 0;
        margin: 0;
        pointer-events: none;
    }
    body {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: baseline;
        align-items: center;
        background-color: rgb(24, 24, 24);
        padding-left: 40px;
        -webkit-app-region: no-drag;
    }
    .error {
        width: 500px;
        height: 100px;
        text-align: left;
        font-family: monospace;
        overflow-y: auto;
        text-overflow: ellipsis;
        background-color: rgb(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 5px;
    }
</style>
<script>
    async function showDiagnostic(element) {
        element.innerText = await window.electronAPI.invoke('diagnosticInfo', []);
    }
    showDiagnostic(document.querySelector('.credit'));
    var audio = new Audio('./ost.mp3');
    audio.loop = true;
    audio.play();

    (async () => {
        document.querySelector('.error').innerText = await window.electronAPI.invoke('fetchSharedVariable', ['errorMessage']);
    })();
</script>
</html>
