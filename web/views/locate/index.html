<div>
    <h1>$$locate_title$$</h1>
    <p class="calibri">$$locate_desc$$</p>
    <p class="noticebox">
        $$import_notice$$
    </p>
    <hr>
    <div>
        <p style="display: flex; justify-content: left; align-items: center; gap: 10px;">
        <span class="material-symbols-outlined">gamepad_up</span>
        $$locate_selectgame$$
        </p>
        <div class="gOptions">

        </div>
        <p style="display: flex; justify-content: left; align-items: center; gap: 10px;">
        <span class="material-symbols-outlined">folder</span>
        $$locate_selectfolder$$
        </p>
        <div class="fileInput" style="display: flex; justify-content: left; align-items: center; gap: 5px;">
            <input type="text" name="" id="dpath" placeholder="$$locate_path_placeholder$$" style="width: 100%;">
            <button onclick="window.currentPageStack.locateDelta()">
                <span class="material-symbols-outlined" style="font-size: 17px;">folder_open</span>
            </button>
        </div>
        <p class="smaller">$$locate_other_methods$$</p>
        <div class="otherImports">
            <button onclick="window.currentPageStack.steam()" id="feat_steam">
                <brand-icon style="font-size: 14px;">S</brand-icon> $$locate_steam_import$$
            </button>
            <button onclick="window.currentPageStack.downloadDelta()" id="feat_autodownload">
                <span class="material-symbols-outlined" style="font-size: 14px;">cloud_download</span> $$locate_autodownload$$
            </button>
        </div>
    </div>
    <br>
    <hr>
    <div class="copyAnyways">
        <input type="checkbox" name="" id="copyAnyways">
        <label for="copyAnyways">$$locate_copyanyways$$</label>
    </div>
    <br>
    <button onclick="window.currentPageStack.id()">$$save_and_close$$</button>
    <br><br>
</div>
<style>
    .selectedGameIco {
        scale: 1.19;
        opacity: 1 !important;
    }
    .copyAnyways {
        display: flex;
        justify-content: left;
        align-items: center;
        gap: 10px;
        cursor: pointer;
    }
    input[type="checkbox"] {
        width: 20px;
        height: 20px;
    }
    .otherImports {
        display: flex;
        justify-content: left;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
    }
    .otherImports > button {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
    }
    .noticebox {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        background-color: rgba(255, 0, 0, 0.318);
        backdrop-filter: blur(5px);
        border: 1px solid red;
    }
    .smaller {
        font-size: 14px;
        color: #888;
    }
    .gOptions {
        width: 100%;
        height: 50px;
        padding: 10px;
        border-radius: 10px;
        background-color: rgb(0,0,0,0.5);
        backdrop-filter: blur(5px);
        display: flex;
        justify-content: left;
        align-items: center;
        gap: 20px;
        border: 1px solid var(--theme-color);
    }
    .gameIco {
        width: 30px;
        opacity: 0.4;
        padding: 10px;
        transition: all 0.3s ease;
    }
</style>
JSL
AUDIO[mainTheme.mp3]
TITLEKEY[locate_title]
