<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltamod error</title>
    <link rel="stylesheet" href="../../commons/base.css">
</head>
<body>
    <div class="win">
        <div class="organizer">
            <img src="dog-maraca.gif" alt="Dog Maraca" width="130" style="margin-bottom: 10px;">
            <h1>
                <marquee behavior="scroll" direction="left" scrollamount="10">Deltamod reportedly crashed, according to recent findings made by the error screen.</marquee>
            </h1>
            <p>If you want to report it, go to "Documents" > "deltamod" and find the file named <code id="errorfilename">(shit)</code>. You can then send its contents to a Deltamod dev.</p>
            <div class="button-container">
                <button id="showerror">Show error file</button>
                <button id="copyerror">Copy error to clipboard</button>
                <button id="gitbtn" onclick="openErrorGithub()">Report this issue on GitHub</button>
            </div>
            <br>
            <pre id="errorPre"><code id="error"></code></pre>
        </div>
    </div>
    <button id="close" onclick="window.close()">X</button>
</body>
<style>
    #close {
        position: fixed;
        top: 0;
        right: 0;
        padding: 20px;
        font-size: 19px;
    }
    #errorPre {
        text-align: left;
        max-width: 100%;
    }
    p {
        color: #ffffff;
        font-family: 'Calibri', sans-serif;
        font-size: 15px;
    }
    code {
        font-size: 10px;
    }
    body {
        width: 100%;
        height: 100vh;
    }
    .win {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
    }
    div {
        text-align: center;
        width: 90%;
    }
    a {
        color: white;
    }
    .button-container {
        display: flex;
        gap: 15px;
        justify-content: center;
        align-items: center;
        width: 100%;
    }
    img {
            image-rendering: -webkit-optimize-contrast; /* Safari */
            image-rendering: -moz-crisp-edges;         /* Firefox */
            image-rendering: -o-crisp-edges;
            image-rendering: pixelated;                /* Chrome / modern */
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;  /* IE */
            transform-origin: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
    @keyframes slidein {
        from {
            transform: translateX(-45px);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }
    .organizer {
        animation: 0.4s ease-in-out 0s 1 slidein;
    }
</style>
<script>
    let error;
    const filename = "DELTAMOD_ERROR_REPORT_" + Date.now() + ".txt";
    let filepath;

    async function openErrorGithub() {
        window.alert('NOTE: Please make sure to add at the bottom of the generated error report what you were doing when the error happened, and any other information you think might be useful.');
        var url = (`https://github.com/deltamodders/deltamod/issues/new?title=[DELTAMOD ERROR REPORT] ${error.substr(0,15)}...&body=**DELTAMOD ERROR REPORT - GENERATED BY DELTAMOD**<br />I have encountered this error:<br /> \`\`\`${error}\`\`\`<br /><br />Version: ${await window.electronAPI.invoke('version')}<br />OS: ${navigator.userAgent}<br /><br />Please describe what you were doing when the error happened, and any other information you think might be useful:<br /><br />`);
        window.electronAPI.invoke('openExternal', [url]);
    }

    (async() => {
        error = await window.electronAPI.invoke('fetchSharedVariable',['error']);
        document.querySelector('#error').innerText = error;
        document.querySelector('#errorfilename').innerText = await window.electronAPI.invoke('fetchSharedVariable',['filename']);
        filepath = await window.electronAPI.invoke('fetchSharedVariable',['filepath']);

        document.querySelector('#showerror').addEventListener('click', () => {
            window.electronAPI.invoke('showItem', [filepath]);
        });
    })();

    (async () => {
        var a = new Audio('ost.mp3');
        a.playbackRate = 1;
        a.loop = true;
        let shouldPlayAudio = await window.electronAPI.invoke('getUniqueFlag', ["AUDIO"]);
        if (shouldPlayAudio) {
            a.play().catch((e) => {
                console.error("Audio playback failed:", e);
            });
        }
        window.focus();
    })();
</script>
</html>
