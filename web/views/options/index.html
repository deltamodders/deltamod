<div>
    <h1>Options</h1>
    <div style="overflow-y: scroll; height: 100%; overflow-x: hidden; display: flex; justify-content: left; align-items: baseline; gap: 70px;">
        <div class="cat" style="width: 20%; display: unset;">
            <button onclick="window.currentPageStack.cat('gen')" id="b_gen" class="noScaleBTN optbtn">
                <span class="material-symbols-outlined">
                discover_tune
                </span>
                General
            </button>
            <button onclick="window.currentPageStack.cat('ui')" id="b_ui" class="noScaleBTN optbtn">
                <span class="material-symbols-outlined">
                    palette
                </span>
                Interface
            </button>
            <button onclick="window.currentPageStack.cat('inst')" id="b_inst" class="noScaleBTN optbtn">
                <span class="material-symbols-outlined">
                    computer
                </span>
                Installation
            </button>
            <button onclick="window.currentPageStack.cat('adv')" id="b_adv" class="noScaleBTN optbtn">
                <span class="material-symbols-outlined">
                    terminal_2
                </span> 
                Advanced
            </button>
            <button id="b_accounts" onclick="window.currentPageStack.expandSemimenu('accounts')" class="noScaleBTN optbtn semimenuCollapser">
                <span class="material-symbols-outlined">
                    account_circle
                </span> 
                Accounts
            </button>
            <div class="semimenu" id="accounts" style="display: none;">
                <button onclick="window.currentPageStack.cat('gb', false)" id="b_gb" class="noScaleBTN optbtn minibtn">
                    <brand-icon>B</brand-icon>
                    GameBanana
                </button>
                <button onclick="window.currentPageStack.cat('itch', false)" id="b_itch" class="noScaleBTN optbtn minibtn">
                    <brand-icon>I</brand-icon>
                    itch.io
                </button>
                <button onclick="window.currentPageStack.cat('gamejolt', false)" id="b_gamejolt" class="noScaleBTN optbtn minibtn">
                    <brand-icon>J</brand-icon>
                    GameJolt
                </button>
            </div>
            <button onclick="window.currentPageStack.cat('help')" id="b_help" class="noScaleBTN optbtn">
                <span class="material-symbols-outlined">
                    question_mark
                </span> 
                Help
            </button>
            <button onclick="window.currentPageStack.cat('dev')" id="b_dev" style="display: none;" class="noScaleBTN optbtn">
                <span class="material-symbols-outlined">
                    code
                </span>
                Developer
            </button>
        </div>
        <div class="opt" style="width: 70%; display: unset;">
            <table style="width: 100%; max-height: 200px; overflow-y: scroll;" id="modtable">
                <colgroup>
                    <col style="width: 80%;">
                    <col style="width: 20%;">
                </colgroup>
                <thead style="position: sticky; top: -2px;">
                    <tr>
                        <th>Option</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="options">
                    <tr>
                        <td colspan="2" style="text-align: center;">Select a category on the left to view the options.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
