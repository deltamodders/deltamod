<!DOCTYPE html>
<html lang="en">
<head id="head">
    <title>Deltamod</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="commons/base.css">
    <link rel="stylesheet" href="index.css">

    <script src="./modules/tippy/popper.min.js"></script>
    <script src="./modules/tippy/tippy-bundle.umd.js"></script>
</head>
<body>
    <div class="bg">
        
    </div>
    <div class="topbar" style="display: flex; justify-content: space-between; align-items: center;">
        <div class="title" style="justify-content: left; -webkit-app-region: drag !important;">
            <img src="./img/packIcon.png" class="dmodicon" alt="" width="23">
            <p>Deltamod</p>
            <span id="versionTitle" style="color: #ccc; font-size: 14px;"></span>
        </div>
        <div class="barbtns" style="margin-right: 30px;">
            <button onclick="toggleMinimize()" class="bar-button minimize-button" title="Minimize">
                <span class="material-symbols-outlined">minimize</span>
            </button>
            <button onclick="toggleFullscreen()" class="bar-button maximize-button" title="Maximize">
                <span class="material-symbols-outlined" style="font-size: small !important;">crop_square</span>
            </button>
            <button onclick="window.close()" class="bar-button close-button" title="Close">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
    </div>
    <div class="viewport">
        <div class="loadingBar">
            
        </div>
    </div>
    <div class="sidebar">
        <div class="sidebar-buttons">
            <div class="sidebar-ribbon" data-page="main">
                <img src="sbar/main.png" alt="" width="20">
                <p>Home</p>
            </div>

            <div class="sidebar-ribbon" data-page="allmods">
                <img src="sbar/allmods.png" alt="" width="20">
                <p>Library</p>
            </div>

            <div class="sidebar-ribbon" data-page="options">
                <img src="sbar/options.png" alt="" width="20">
                <p>Options</p>
            </div>
            
            <div class="sidebar-ribbon" data-page="installmanager">
                <img src="sbar/installmanager.png" alt="" width="20">
                <p>Installs</p>
            </div>

            <!-- JS should display this if user toggled GameBanana specific features -->
            <div class="sidebar-ribbon" id="shopRibbon" data-page="gamebanana-browse">
                <img src="sbar/shop.png" alt="" width="20">
                <p>Shop</p>
            </div>

            <div class="sidebar-ribbon" style="display: none;" id="collectionsRibbon" data-page="collections">
                <img src="sbar/collections.png" alt="" width="20">
                <p>Collections</p>
            </div>

            <div class="sidebar-ribbon" data-page="credits">
                <img src="sbar/credits.png" alt="" width="20">
                <p>Info</p>
            </div>
        </div>
    </div>
    <div class="gamebanana-account" style="opacity: 0;">

    </div>
    <div class="alertMain" style="display: none;">
        <div class="alertMsg">
            <h1>Example Alert</h1>
            <p>This alert is an <b>example</b>.</p>
            <div style="text-align: right;">
                <button>OK</button>
            </div>
        </div>
    </div>
</body>
<div class="winb">
    
</div>
<div class="glyph">

</div>
<style id="dynamic-theme-styles"></style>
<script src="index.js"></script>
<script src="controllers.js"></script>
</html>
