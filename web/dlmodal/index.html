<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading...</title>
</head>
<body>
    <img src="./logo.png" alt="" width="70" class="deltamodLogo">
</body>
<script>
    function updateProgress(percent) {
        const value = Math.max(0, Math.min(100, Number(percent) || 0));
        const logo = document.querySelector(".deltamodLogo");
        if (!logo) return;

        let canvas = document.getElementById("progressCircle");
        if (!canvas) {
            canvas = document.createElement("canvas");
            canvas.id = "progressCircle";
            canvas.width = 200;
            canvas.height = 200;
            canvas.style.position = "fixed";
            canvas.style.zIndex = "3";
            canvas.style.pointerEvents = "none";
            document.body.appendChild(canvas);

            const placeCircle = () => {
                const r = logo.getBoundingClientRect();
                canvas.style.left = `${r.left + r.width / 2 - canvas.width / 2}px`;
                canvas.style.top = `${r.top + r.height / 2 - canvas.height / 2}px`;
            };

            placeCircle();
            window.addEventListener("resize", placeCircle);
            window.addEventListener("scroll", placeCircle, true);
        }

        const ctx = canvas.getContext("2d");
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const radius = 54;
        const start = -Math.PI / 2;
        const end = start + (Math.PI * 2 * value) / 100;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Track
        ctx.lineWidth = 8;
        ctx.strokeStyle = "rgba(255,255,255,0.25)";
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();

        // Progress (0 -> 360)
        ctx.strokeStyle = "#ffffff";
        if (value >= 100) {
            ctx.strokeStyle = "#006600";
        }
        ctx.beginPath();
        ctx.arc(cx, cy, radius, start, end, false);
        ctx.stroke();
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateProgress(0);
    });
</script>
<style>
    body {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: url(./anotherhim.webp);
        background-repeat: no-repeat;
        background-size: cover;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
    }
    .progbar {
        height: 9px;
        position: fixed;
        border-top-right-radius: 5px;
        border-bottom-right-radius: 5px;
        z-index: 2;
        bottom: 10px;
        left: 10px;
        background-color: rgba(255, 255, 255, 0.741);
    }
</style>
</html>
