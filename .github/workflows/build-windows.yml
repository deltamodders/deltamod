name: build on Windows

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: windows-2022

    strategy:
      matrix:
        node-version:
          - 25.x

    steps:
      - name: Get repo
        uses: actions/checkout@v4

      - name: Setup build tools (1 / 3)
        uses: microsoft/setup-msbuild@v2

      - name: Setup build tools (2 / 3)
        shell: powershell
        run: |
          choco install visualstudio2022buildtools --package-parameters "--passive --wait --norestart --add Microsoft.VisualStudio.Workload.NativeDesktop --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre --add Microsoft.VisualStudio.Component.VC.ATL.Spectre --add Microsoft.VisualStudio.Component.VC.Redist.Spectre --includeRecommended" -y

      - name: Setup build tools (3 / 3)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dependencies
        run: npm rebuild

      - name: Build Deltamod
        run: npm run build-windows

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: deltamod-win-unpacked
          path: dist/win-unpacked/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: deltamod-win-installer
          path: dist/Deltamod-Setup.exe