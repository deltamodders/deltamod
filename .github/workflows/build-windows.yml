name: build on Windows

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        node-version:
          - 25.x

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Visual Studio C++ build tools
        shell: powershell
        run: |
          choco install visualstudio2022-workload-vctools `
            --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre --includeRecommended" `
            -y

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Display tool versions
        shell: powershell
        run: |
          node --version
          npm --version
          python --version

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm rebuild

      - name: Build Windows application
        run: npm run build-windows

      - name: Create ZIP archive
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist/win-unpacked/*" `
            -DestinationPath "dist/Deltamod-files.zip"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: deltamod-win-unpacked
          path: dist/Deltamod-files.zip