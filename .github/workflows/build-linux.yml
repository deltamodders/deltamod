name: build on Linux

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - 25.x

    steps:
      - name: Get repo
        uses: actions/checkout@v4

      - name: Setup build tools (1 / 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Setup build tools (2 / 2)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dependencies
        run: npm rebuild

      - name: Build Deltamod
        run: npm run build-linux

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: deltamod-linux-unpacked
          path: dist/linux-unpacked/

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: deltamod-linux-appimage
          path: dist/Deltamod-AppImage.AppImage