name: Release on GitHub

on:
  workflow_run:
    workflows:
      - build on Windows
      - build on Linux
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Find artifacts
        id: builds
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          find_run() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$1/runs?status=success&per_page=100" \
              | jq -r --arg sha "$COMMIT_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' \
              | head -n 1
          }

          for attempt in $(seq 1 30); do
            windows_run=$(find_run "build-windows.yml")
            linux_run=$(find_run "build-linux.yml")

            if [ -n "$windows_run" ] && [ -n "$linux_run" ]; then
              echo "windows_run=$windows_run" >> "$GITHUB_OUTPUT"
              echo "linux_run=$linux_run" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Waiting for both builds for $COMMIT_SHA (attempt $attempt/30)"
            sleep 10
          done

          echo "Timed out waiting for both builds for $COMMIT_SHA" >&2
          exit 1

      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/windows artifacts/linux artifacts/appimage

          gh run download "${{ steps.builds.outputs.windows_run }}" \
            --name deltamod-win-unpacked --dir artifacts/windows
          gh run download "${{ steps.builds.outputs.linux_run }}" \
            --name deltamod-linux-unpacked --dir artifacts/linux
          gh run download "${{ steps.builds.outputs.linux_run }}" \
            --name deltamod-linux-appimage --dir artifacts/appimage

      - name: Package artifacts
        run: |
          set -euo pipefail
          cd artifacts
          zip -qr ../deltamod-windows.zip windows
          zip -qr ../deltamod-linux.zip linux
          mv appimage/Deltamod-AppImage.AppImage ../Deltamod-AppImage.AppImage

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="prerelease-${COMMIT_SHA:0:12}"
          title="Deltamod prerelease ${COMMIT_SHA:0:12}"

          gh release create "$tag" \
            --target "$COMMIT_SHA" \
            --title "$title" \
            --prerelease \
            deltamod-windows.zip deltamod-linux.zip Deltamod-AppImage.AppImage \
            || gh release upload "$tag" \
              --clobber \
              deltamod-windows.zip deltamod-linux.zip Deltamod-AppImage.AppImage